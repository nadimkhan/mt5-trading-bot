# MT5 Trading Bot Configuration

# AI Provider Settings
ai:
  provider: "kiraai"  # Options: claude, openai, groq, kiraai (recommended for free tier)
  api_key: "kira_a9516f77cad83225c3855f3f56fcab01"  # Get from kiraai.vn/developer/
  model: "qwen3.8-flash-free"  # KiraAI free model (Qwen 3.8 Flash)
  max_tokens: 1000
  temperature: 0.7

# MT5 Connection
mt5:
  login: 57452518479
  password: ""  # Leave empty if no password needed for demo
  server: "GTCGlobalTrade-Demo"
  path: "D:/Program Files/GTC Global Trade MetaTrader 5/terminal64.exe"
  magic_number: 123456  # Only manage trades with this magic number

# Reconnection Settings
reconnect:
  max_attempts: 5           # Max reconnect attempts before giving up
  initial_delay_seconds: 2  # Start with 2 second delay
  max_delay_seconds: 60     # Max delay between attempts

# Drawdown Kill Switch
drawdown:
  max_percent: 5.0          # Max drawdown from equity peak
  daily_limit_percent: 3.0   # Daily loss limit

# Trading Settings
trading:
  max_positions: 5
  max_lot_size: 0.10
  default_lot_size: 0.01
  default_stop_loss_pips: 30
  default_take_profit_pips: 50

# Scalping Timeframe Settings
timeframes:
  trend: "M15"     # M15 - intra-session trend
  entry: "M5"      # M5 - entry setups with EMA crossover
  confirm: "M1"    # M1 - precise entry confirmation

# Risk Management
risk:
  max_risk_per_trade: 1.0       # 1% per trade (tightened from 2%)
  daily_loss_limit: 3.0          # 3% daily loss limit
  max_drawdown_percent: 10.0
  spread_cap_pips: 20             # Max spread to enter

# Trade Management
breakeven:
  enabled: true
  trigger_pips: 20               # Move to BE when profit reaches 20 pips

partial_tp:
  enabled: true
  percentage: 50                # Close 50% at TP1
  at_pips: 30                    # Partial TP level

trailing:
  enabled: true
  atr_multiplier: 3.0            # ATR x 3 for trailing distance
  period: 14                     # ATR period
  threshold_pips: 15             # Only trail after 15 pips profit

# Engine Settings for Scalping
engine:
  scalp_loop_seconds: 15     # 15 seconds between scalp checks
  trend_loop_seconds: 60    # 1 minute between M15 trend updates
  ai_timeout_seconds: 30     # Max wait for AI response
  max_retries: 3            # Retry failed AI calls
  
# Dashboard
dashboard:
  host: "127.0.0.1"
  port: 5000


# Trade Management
trade_management:
  # Set to true to hide SL/TP from MT5 (managed by our script for regime-change exits)
  # When false (default), SL/TP are sent to MT5 and visible in terminal
  hidden_sl_tp: true

  # Close positions when market regime changes from entry regime
  # e.g. BULL->BEAR or BULL->SIDEWAYS will close long positions
  regime_exit: true
