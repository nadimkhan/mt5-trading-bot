<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Trading Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --bg-primary: #060912;
            --bg-secondary: #0c111c;
            --bg-card: #0f1623;
            --bg-card-hover: #131c2d;
            --border-color: #1a2335;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.3);
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.3);
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; font-size: 11px; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        h1, h2, h3, h4, h5, h6, .heading { font-family: 'Poppins', sans-serif; font-weight: 600; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .dashboard { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 64px 1fr; min-height: 100vh; }

        .header {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 24px; }
        .logo { display: flex; align-items: center; gap: 10px; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .logo-icon {
            background: none;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status-badge { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; font-size: 13px; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .status-dot.ready { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green-glow); }
        .status-dot.running { background: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan-glow); animation: pulse 2s infinite; }
        .status-dot.error { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red-glow); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .time-display { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-secondary); }
        .live-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent-green); }
        .live-indicator::before { content: ''; width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: pulse 1.5s infinite; }

        .sidebar { background: var(--bg-secondary); border-right: 1px solid var(--border-color); padding: 24px 10px; overflow-y: auto; }
        .nav-section { margin-bottom: 16px; padding: 0 10px; }
        .nav-section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; }

        /* Asset picker dropdown */
        .asset-picker { position: relative; }
        .asset-picker-toggle { width: 100%; padding: 8px 10px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: inherit; font-size: 11px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .asset-picker-toggle:hover { border-color: var(--accent-cyan); }
        .asset-picker-toggle .arrow { font-size: 9px; color: var(--text-muted); transition: transform 0.2s; }
        .asset-picker.open .asset-picker-toggle .arrow { transform: rotate(180deg); }
        .asset-picker-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; max-height: 320px; z-index: 100; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); overflow: hidden; }
        .asset-picker.open .asset-picker-dropdown { display: flex; flex-direction: column; }
        .asset-category { padding: 6px 10px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .asset-list { overflow-y: auto; flex: 1; max-height: 240px; }
        .asset-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-size: 11px; border-bottom: 1px solid var(--border-color); transition: background 0.15s; }
        .asset-item:last-child { border-bottom: none; }
        .asset-item:hover { background: var(--bg-card-hover); }
        .asset-item .symbol { font-weight: 400; font-family: 'JetBrains Mono', monospace; }
        .asset-item .desc { font-size: 9px; color: var(--text-muted); margin-left: 6px; }
        .asset-item button { padding: 3px 10px; font-size: 10px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
        .asset-item .btn-add { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.3); }
        .asset-item .btn-add:hover { background: var(--accent-cyan); color: #000; }
        .asset-item .btn-added { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.2); cursor: not-allowed; }
        .asset-item .btn-remove { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.2); }
        .asset-item .btn-remove:hover { background: var(--accent-red); color: #fff; }

        /* Added assets list */
        .added-assets-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
        .added-assets-header { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .added-assets-header .count { background: var(--accent-cyan); color: #000; padding: 1px 6px; border-radius: 8px; font-size: 9px; font-weight: 700; }
        .added-asset { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 11px; }
        .added-asset:not(:last-child) { border-bottom: 1px solid var(--border-color); }
        .added-asset .info { display: flex; align-items: center; gap: 6px; }
        .added-asset .symbol { font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .added-asset .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); }
        .added-asset .remove { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; font-size: 11px; }
        .added-asset .remove:hover { color: var(--accent-red); }
        .empty-assets { font-size: 10px; color: var(--text-muted); text-align: center; padding: 8px 0; font-style: italic; }

        .strategy-selector { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-start { background: linear-gradient(135deg, var(--accent-green), #059669); color: #fff; }
        .btn-start:hover:not(:disabled) { box-shadow: 0 4px 20px var(--accent-green-glow); transform: translateY(-1px); }
        .btn-start:disabled { background: var(--bg-secondary); color: var(--text-muted); cursor: not-allowed; opacity: 0.5; }
        .btn-stop { background: var(--bg-card); color: var(--accent-red); border: 1px solid var(--border-color); }
        .btn-stop:hover:not(:disabled) { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
        .btn-stop:disabled { background: var(--bg-secondary); color: var(--text-muted); border-color: var(--border-color); cursor: not-allowed; opacity: 0.5; }

        /* Header control buttons (smaller) */
        .header-controls { display: flex; gap: 8px; align-items: center; }
        .header-btn { padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; min-width: 80px; }
        .header-btn-start { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
        .header-btn-start:hover:not(:disabled) { background: #059669; box-shadow: 0 0 12px var(--accent-green-glow); }
        .header-btn-start:disabled { background: var(--bg-secondary); color: var(--text-muted); border-color: var(--border-color); cursor: not-allowed; opacity: 0.5; }
        .header-btn-stop { background: var(--bg-card); color: var(--accent-red); border-color: var(--border-color); }
        .header-btn-stop:hover:not(:disabled) { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
        .header-btn-stop:disabled { background: var(--bg-secondary); color: var(--text-muted); border-color: var(--border-color); cursor: not-allowed; opacity: 0.5; }
        .strategy-btn { flex: 1; padding: 12px 8px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary); color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
        .strategy-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .strategy-btn.active { background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(139, 92, 246, 0.15)); border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .strategy-btn .strategy-name { display: block; font-size: 14px; margin-bottom: 2px; }
        .strategy-btn .strategy-desc { font-size: 10px; font-weight: 400; color: var(--text-muted); }

        .main { padding: 24px; overflow-y: auto; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        .page-title span { color: var(--accent-cyan); }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; position: relative; overflow: hidden; transition: all 0.2s; }
        .stat-card:hover { border-color: var(--accent-cyan); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); opacity: 0.5; }
        .stat-card.green::before { background: var(--accent-green); opacity: 1; }
        .stat-card.red::before { background: var(--accent-red); opacity: 1; }
        .stat-card.purple::before { background: var(--accent-purple); opacity: 1; }
        .stat-label { font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; line-height: 1; transition: color 0.2s; }
        .stat-value.positive { color: var(--accent-green); }
        .stat-value.negative { color: var(--accent-red); }
        .stat-value.loading { opacity: 0.4; }

        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; transition: border-color 0.2s; min-height: 200px; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--border-color); }
        .card.loading { opacity: 0.6; }
        .card-content { flex: 1; overflow-y: auto; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .card-title svg { width: 18px; height: 18px; stroke: var(--accent-cyan); stroke-width: 2; fill: none; }
        .card-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; font-size: 10px; color: var(--text-muted); }

        /* Loading spinner */
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border-color); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-muted); font-size: 12px; display: flex; align-items: center; gap: 8px; padding: 20px 0; justify-content: center; }

        .positions-table { width: 100%; border-collapse: collapse; }
        .positions-table th { text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: var(--bg-card); }
        .positions-table td { padding: 12px; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .positions-table tr:last-child td { border-bottom: none; }
        .positions-table tr:hover { background: var(--bg-card-hover); }
        .symbol-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg-secondary); border-radius: 6px; font-weight: 600; font-size: 12px; }
        .type-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .type-badge.buy { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .type-badge.sell { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
        .pnl-value { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
        .pnl-value.positive { color: var(--accent-green); }
        .pnl-value.negative { color: var(--accent-red); }

        .market-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border-color); transition: background 0.2s; }
        .market-item:last-child { border-bottom: none; }
        .market-item:hover { background: var(--bg-card-hover); }
        .market-symbol { display: flex; align-items: center; gap: 12px; }
        .market-name { font-weight: 600; font-size: 14px; }
        .market-trend { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
        .market-trend.bull { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .market-trend.bear { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
        .market-trend.sideways { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
        .market-price { text-align: right; }
        .market-price-value { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; }
        .market-price-info { font-size: 11px; color: var(--text-muted); }

        .decision-item { padding: 12px; border-bottom: 1px solid var(--border-color); }
        .decision-item:last-child { border-bottom: none; }
        .decision-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .decision-symbol { font-weight: 600; font-size: 13px; }
        .decision-action { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
        .decision-action.buy { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .decision-action.sell { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
        .decision-action.hold { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
        .decision-action.veto { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }
        .decision-action.reject { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .decision-action.confirmed { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }
        .decision-reason { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
        .decision-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--text-muted); }
        .confidence-bar { width: 60px; height: 4px; background: var(--bg-secondary); border-radius: 2px; overflow: hidden; }
        .confidence-fill { height: 100%; border-radius: 2px; }
        .confidence-fill.high { background: var(--accent-green); }
        .confidence-fill.medium { background: var(--accent-orange); }
        .confidence-fill.low { background: var(--accent-red); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state svg { width: 48px; height: 48px; stroke: var(--border-color); stroke-width: 1.5; fill: none; margin-bottom: 16px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); padding: 24px; border-radius: 6px; max-width: 400px; width: 90%; text-align: center; }
        .modal-content h3 { margin-bottom: 12px; color: var(--accent-cyan); }
        .modal-content p { color: var(--text-secondary); margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
        .modal-btn.primary { background: var(--accent-cyan); color: #000; }
        .modal-btn.secondary { background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border-color); }
        .modal-btn.danger { background: var(--accent-red); color: #fff; }

        .config-modal-content { max-width: 800px; max-height: 85vh; text-align: left; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
        .config-modal-content h3 { padding: 20px 24px; border-bottom: 1px solid var(--border-color); margin: 0; }
        .config-tabs { display: flex; gap: 8px; padding: 12px 24px; border-bottom: 1px solid var(--border-color); }
        .config-tab { padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary); color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500; }
        .config-tab.active { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); }
        .config-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .config-section { display: none; }
        .config-section.active { display: block; }
        .config-param { margin-bottom: 16px; padding: 12px; background: var(--bg-secondary); border-radius: 6px; border: 1px solid var(--border-color); }
        .config-param-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .config-param-label .label { font-weight: 600; font-size: 13px; }
        .config-param-label .current-value { font-family: 'JetBrains Mono', monospace; color: var(--accent-cyan); font-size: 14px; font-weight: 600; }
        .config-param-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
        .config-param input[type="number"] { width: 100%; padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 14px; }
        .config-param input[type="number"]:focus { outline: none; border-color: var(--accent-cyan); }
        .config-param .range-input { display: flex; align-items: center; gap: 12px; }
        .config-param input[type="range"] { flex: 1; }
        .config-buttons { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border-color); justify-content: space-between; }

        .sidebar-btn { width: 100%; margin: 8px 12px 16px; padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: block; }
        .sidebar-btn:hover { border-color: var(--accent-purple); color: var(--accent-purple); background: rgba(139, 92, 246, 0.1); }

        .streak-indicator { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace; background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); }
        .streak-indicator.win { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border-color: var(--accent-green); }
        .streak-indicator.loss { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border-color: var(--accent-red); }

        .stat-mini { display: flex; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--text-muted); align-items: center; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="header-left">
                <div class="logo"><span class="logo-icon">MT5TB</span></div>
                <div class="status-badge"><span class="status-dot" id="status-dot"></span><span id="engine-status">STOPPED</span></div>
                <div class="live-indicator">LIVE</div>
            </div>
            <div class="header-controls">
                <button class="header-btn header-btn-start" id="btn-start">Start</button>
                <button class="header-btn header-btn-stop" id="btn-stop" disabled>Stop</button>
                <div class="time-display" id="time-display">--:--:--</div>
            </div>

                    <div class="added-assets-header">

        <main class="main">
            <h1 class="page-title">Dashboard <span style="font-size: 10px; color: var(--text-muted); font-weight: 400; font-family: 'JetBrains Mono', monospace; margin-left: 8px;">v2.0</span></h1>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">Total P&L</div><div class="stat-value" id="stat-pnl">$0.00</div></div>
                <div class="stat-card green"><div class="stat-label">Win Rate</div><div class="stat-value" id="stat-winrate">0%</div><div class="stat-mini"><span class="streak-indicator" id="stat-streak">-</span><span id="stat-trades-today">0</span> today</div></div>
                <div class="stat-card purple"><div class="stat-label">Open Positions</div><div class="stat-value" id="stat-open">0</div></div>
                <div class="stat-card"><div class="stat-label">Total Trades</div><div class="stat-value" id="stat-trades">0</div></div>
            </div>

            <div class="grid-2">
                <div class="card">
                    <div class="card-header"><div class="card-title"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Open Positions</div></div>
                    <div id="positions-data" class="card-content"></div>
                </div>
                <div class="card">
                    <div class="card-header"><div class="card-title"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Market Analysis</div></div>
                    <div id="market-data" class="card-content"></div>
                </div>
                <div class="card">
                    <div class="card-header"><div class="card-title"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/></svg>AI Decisions</div></div>
                    <div id="ai-decisions" class="card-content"></div>
                </div>
                <div class="card">
                    <div class="card-header"><div class="card-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Recent Trades</div></div>

    <div id="symbolModal" class="modal">
        <div class="modal-content"><h3>Notification</h3><p id="modal-message">Operation completed</p><div class="modal-buttons"><button class="modal-btn primary" id="modal-ok">OK</button></div></div>
    </div>

    <div id="configModal" class="modal">
        <div class="modal-content config-modal-content">
            <h3>Strategy Configuration</h3>
            <div class="config-tabs" id="config-tabs"></div>
            <div class="config-body" id="config-body"></div>
            <div class="config-buttons">
                <button class="modal-btn danger" id="btn-reset-config">Reset to Defaults</button>
                <div>
                    <button class="modal-btn secondary" id="btn-cancel-config">Cancel</button>
                    <button class="modal-btn primary" id="btn-save-config">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        console.log('%cMT5TB Dashboard v2.0', 'color: #06b6d4; font-weight: bold; font-size: 14px;');
        console.log('If you see old UI, hard-refresh: Ctrl+Shift+R (Windows) or Cmd+Shift+R (Mac)');

        // ========================================
        // UTILITIES
        // ========================================
        function updateTime() { document.getElementById('time-display').textContent = new Date().toLocaleTimeString('en-US', { hour12: false }); }
        setInterval(updateTime, 1000); updateTime();

        // Format currency consistently
        function formatMoney(val) {
            const sign = val >= 0 ? '+' : '-';
            return sign + '$' + Math.abs(val).toFixed(2);
        }

        // Format percentage
        function formatPct(val) { return val + '%'; }

        // Show loading spinner in an element
        function showLoading(elementId, message) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = '<div class="loading-text"><span class="spinner"></span>' + (message || 'Loading...') + '</div>';
        }

        // Show friendly error
        function showError(elementId, error) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = '<div class="empty-state" style="color: var(--accent-red);"><p>⚠ ' + error + '</p></div>';
        }

        // Show empty state
        function showEmpty(elementId, icon, message, hint) {
            const el = document.getElementById(elementId);
            if (!el) return;
            let html = '<div class="empty-state">';
            if (icon) html += '<div style="font-size: 32px; opacity: 0.5; margin-bottom: 8px;">' + icon + '</div>';
            html += '<p style="font-weight: 500; margin-bottom: 4px;">' + message + '</p>';
            if (hint) html += '<p style="font-size: 11px; color: var(--text-muted);">' + hint + '</p>';
            html += '</div>';
            el.innerHTML = html;
        }

        // Button handlers
        document.getElementById('btn-start').addEventListener('click', function() {
            fetch('/api/start', { method: 'POST' }).then(r => r.json()).then(d => { if (d.error) showModal(d.error); else showModal('Engine started'); });
        });
        document.getElementById('btn-stop').addEventListener('click', function() {
            fetch('/api/stop', { method: 'POST' }).then(r => r.json()).then(d => { if (d.error) showModal(d.error); else showModal('Engine stopped'); });
        });
        document.getElementById('btn-scalp').addEventListener('click', function() { setStrategy('scalp'); });
        document.getElementById('btn-trend').addEventListener('click', function() { setStrategy('trend'); });
        document.getElementById('btn-ml').addEventListener('click', function() { setStrategy('ml'); });
        document.getElementById('btn-ml-search').addEventListener('click', runMLSearch);
        document.getElementById('modal-ok').addEventListener('click', closeModal);
        document.getElementById('symbolModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        socket.on('connect', () => { loadInitialData(); loadAssets(); });

        // ========================================
        // ASSET PICKER
        // ========================================
        let allAssets = [];
        let addedSymbols = new Set();

        function loadAssets() {
            // Fetch available symbols and added symbols
            Promise.all([
                fetch('/api/symbols/available').then(r => r.ok ? r.json() : []),
                fetch('/api/symbols').then(r => r.ok ? r.json() : [])
            ]).then(([available, added]) => {
                addedSymbols = new Set(added.filter(s => s.enabled).map(s => s.symbol));
                allAssets = available;
                renderAssetList(available);
                renderAddedAssets(added);
            }).catch(err => {
                console.error('Failed to load assets:', err);
                document.getElementById('asset-list').innerHTML = '<div class="empty-assets">Failed to load</div>';
            });
        }

        function renderAssetList(assets) {
            const container = document.getElementById('asset-list');
            if (!assets || assets.length === 0) {
                container.innerHTML = '<div class="empty-assets" style="padding: 20px;">Start engine to load symbols</div>';
                return;
            }
            // Categorize
            const categories = { 'Forex Majors': [], 'Forex Crosses': [], 'Commodities': [], 'Crypto': [], 'Indices': [], 'Other': [] };
            assets.forEach(sym => {
                const s = sym.toUpperCase();
                if (s.includes('USD') && (s.includes('EUR') || s.includes('GBP') || s.includes('JPY') || s.includes('AUD') || s.includes('CAD') || s.includes('CHF') || s.includes('NZD'))) {
                    categories['Forex Majors'].push(s);
                } else if (s.includes('USD') || s.match(/[A-Z]{6}/)) {
                    categories['Forex Crosses'].push(s);
                } else if (s.includes('BTC') || s.includes('ETH') || s.includes('LTC') || s.includes('XRP')) {
                    categories['Crypto'].push(s);
                } else if (s.includes('US') && (s.includes('500') || s.includes('100') || s.includes('30') || s.includes('TECH'))) {
                    categories['Indices'].push(s);
                } else if (s.includes('XAU') || s.includes('XAG') || s.includes('OIL') || s.includes('BRN') || s.includes('GOLD') || s.includes('SILVER')) {
                    categories['Commodities'].push(s);
                } else {
                    categories['Other'].push(s);
                }
            });
            let html = '';
            for (const [cat, syms] of Object.entries(categories)) {
                if (syms.length === 0) continue;
                html += '<div class="asset-category">' + cat + '</div>';
                syms.forEach(sym => {
                    const isAdded = addedSymbols.has(sym);
                    const btnClass = isAdded ? 'btn-added' : 'btn-add';
                    const btnText = isAdded ? 'Added' : 'Add';
                    const disabled = isAdded ? 'disabled' : '';
                    html += '<div class="asset-item"><div><span class="symbol">' + sym + '</span></div>' +
                            '<button class="' + btnClass + '" data-symbol="' + sym + '" ' + disabled + '>' + btnText + '</button></div>';
                });
            }
            container.innerHTML = html;
            // Wire up add buttons
            container.querySelectorAll('.btn-add').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const sym = e.target.dataset.symbol;
                    addAsset(sym);
                });
            });
        }

        function renderAddedAssets(assets) {
            const container = document.getElementById('added-assets-list');
            const countEl = document.getElementById('asset-count');
            const enabled = assets.filter(a => a.enabled);
            countEl.textContent = enabled.length;
            if (enabled.length === 0) {
                container.innerHTML = '<div class="empty-assets">No assets added</div>';
                return;
            }
            let html = '';
            enabled.forEach(a => {
                html += '<div class="added-asset">' +
                            '<div class="info"><span class="status-dot"></span><span class="symbol">' + a.symbol + '</span></div>' +
                            '<button class="remove" data-symbol="' + a.symbol + '" title="Remove">×</button>' +
                        '</div>';
            });
            container.innerHTML = html;
            container.querySelectorAll('.remove').forEach(btn => {
                btn.addEventListener('click', e => {
                    const sym = e.target.dataset.symbol;
                    removeAsset(sym);
                });
            });
        }

        function addAsset(symbol) {
            fetch('/api/symbols/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol })
            }).then(r => r.json()).then(data => {
                if (data.error) {
                    showModal('Error: ' + data.error);
                } else {
                    loadAssets();  // Reload both lists
                }
            });
        }

        function removeAsset(symbol) {
            fetch('/api/symbols/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol })
            }).then(r => r.json()).then(data => {
                if (data.error) {
                    showModal('Error: ' + data.error);
                } else {
                    loadAssets();
                }
            });
        }

        // Toggle asset dropdown
        document.getElementById('asset-picker-toggle').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('asset-picker').classList.toggle('open');
        });
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const picker = document.getElementById('asset-picker');
            if (picker && !picker.contains(e.target)) {
                picker.classList.remove('open');
            }
        });
        socket.on('status_update', (data) => { updateStatus(data); });
        socket.on('decisions_update', (decisions) => { updateDecisions(decisions); });
        socket.on('positions_update', (positions) => { updatePositions(positions); });
        socket.on('history_update', (history) => { updateHistory(history); });
        socket.on('market_update', (marketData) => { updateMarket(marketData); });
        socket.on('analytics_update', (analytics) => { updateAnalytics(analytics); });

        // Show initial loading states
        showLoading('positions-data', 'Loading positions...');
        showLoading('market-data', 'Loading market data...');
        showLoading('ai-decisions', 'Loading AI decisions...');
        showLoading('trade-history', 'Loading trade history...');

        function loadInitialData() {
            // Use safe fetch wrapper for better error handling
            safeFetch('/api/status', updateStatus, (err) => console.error('Status:', err));
            safeFetch('/api/positions', updatePositions, (err) => showError('positions-data', 'Failed to load'));
            safeFetch('/api/analytics', updateAnalytics, (err) => console.error('Analytics:', err));
            safeFetch('/api/strategies', (data) => updateStrategyUI(data.current), (err) => console.error('Strategies:', err));
            safeFetch('/api/decisions', updateDecisions, (err) => showError('ai-decisions', 'Failed to load'));
            safeFetch('/api/history', updateHistory, (err) => showError('trade-history', 'Failed to load'));
            safeFetch('/api/market', updateMarket, (err) => showError('market-data', 'Failed to load'));
        }

        // Safe fetch wrapper
        function safeFetch(url, onSuccess, onError) {
            return fetch(url)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(data => { try { onSuccess(data); } catch(e) { console.error('Handler error:', e); } })
                .catch(err => { if (onError) onError(err); });
        }

        function setStrategy(strategy) {
            fetch('/api/strategies/set', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ strategy: strategy }) })
            .then(r => r.json()).then(d => { if (d.error) showModal(d.error); else { showModal('Strategy: ' + strategy); updateStrategyUI(strategy); } });
        }

        function updateStrategyUI(strategy) {
            document.getElementById('btn-scalp').classList.toggle('active', strategy === 'scalp');
            document.getElementById('btn-trend').classList.toggle('active', strategy === 'trend');
        }

        function updateStatus(data) {
            const status = data.status || 'STOPPED';
            document.getElementById('engine-status').textContent = status;
            const dot = document.getElementById('status-dot');
            dot.className = 'status-dot';
            if (status === 'INITIALIZING') dot.classList.add('running');
            else if (status === 'READY' || status === 'RUNNING') dot.classList.add('running');
            else if (status === 'ERROR') dot.classList.add('error');
            else dot.classList.add('ready');

            // Enable/disable Start and Stop buttons based on engine state
            const startBtn = document.getElementById('btn-start');
            const stopBtn = document.getElementById('btn-stop');
            const isRunning = ['INITIALIZING', 'READY', 'RUNNING'].includes(status);
            if (isRunning) {
                startBtn.disabled = true;
                startBtn.textContent = 'Running';
                stopBtn.disabled = false;
                stopBtn.textContent = 'Stop';
            } else if (status === 'ERROR') {
                startBtn.disabled = false;
                startBtn.textContent = 'Retry';
                stopBtn.disabled = true;
                stopBtn.textContent = 'Stop';
            } else {
                startBtn.disabled = false;
                startBtn.textContent = 'Start';
                stopBtn.disabled = true;
                stopBtn.textContent = 'Stop';
            }
        }

        function updateAnalytics(analytics) {
            if (!analytics) return;
            document.getElementById('stat-trades').textContent = analytics.total_trades || 0;
            document.getElementById('stat-winrate').textContent = (analytics.win_rate || 0) + '%';
            document.getElementById('stat-open').textContent = analytics.open_trades_count || 0;
            const pnl = analytics.total_pnl || 0;
            const pnlEl = document.getElementById('stat-pnl');
            const sign = pnl >= 0 ? '+' : '-';
            pnlEl.textContent = sign + '$' + Math.abs(pnl).toFixed(2);
            pnlEl.className = 'stat-value ' + (pnl >= 0 ? 'positive' : 'negative');

            // Update streak indicator if present
            const streakEl = document.getElementById('stat-streak');
            if (streakEl) {
                const streakType = analytics.streak_type || 'none';
                const streakCount = analytics.streak_count || 0;
                if (streakType === 'win') {
                    streakEl.textContent = streakCount + 'W';
                    streakEl.className = 'streak-indicator win';
                } else if (streakType === 'loss') {
                    streakEl.textContent = streakCount + 'L';
                    streakEl.className = 'streak-indicator loss';
                } else {
                    streakEl.textContent = '-';
                    streakEl.className = 'streak-indicator';
                }
            }

            // Update trades today if present
            const tradesTodayEl = document.getElementById('stat-trades-today');
            if (tradesTodayEl) {
                tradesTodayEl.textContent = (analytics.trades_today || 0);
            }
        }

        function updatePositions(positions) {
            const container = document.getElementById('positions-data');
            if (!positions || positions.length === 0) {
                showEmpty('positions-data', '○', 'No open positions', 'Start the engine to look for trading opportunities');
                return;
            }
            let html = '<table class="positions-table"><thead><tr><th>Symbol</th><th>Type</th><th>Lot</th><th>Entry</th><th>P&L</th></tr></thead><tbody>';
            positions.forEach(p => { const pnl = p.profit || 0; const pnlClass = pnl >= 0 ? 'positive' : 'negative'; const sign = pnl >= 0 ? '+' : '-'; const absPnl = Math.abs(pnl).toFixed(2); html += '<tr><td><span class="symbol-badge">' + p.symbol + '</span></td><td><span class="type-badge ' + p.type.toLowerCase() + '">' + p.type + '</span></td><td>' + p.volume + '</td><td>' + p.price_open.toFixed(5) + '</td><td><span class="pnl-value ' + pnlClass + '">' + sign + '$' + absPnl + '</span></td></tr>'; });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function updateDecisions(decisions) {
            const container = document.getElementById('ai-decisions');
            if (!decisions || decisions.length === 0) {
                showEmpty('ai-decisions', '⌛', 'No decisions yet', 'The bot will log decisions here as it analyzes the market');
                return;
            }
            let html = '';
            decisions.slice(0, 8).forEach(d => {
                const action = d.action || 'HOLD';
                const conf = d.confidence || 50;
                const confClass = conf >= 70 ? 'high' : conf >= 50 ? 'medium' : 'low';
                const time = new Date(d.created_at || Date.now()).toLocaleTimeString();
                // Detect special decision types
                let displayAction = action;
                let actionClass = action.toLowerCase();
                if (d.vetoed) { displayAction = 'VETO'; actionClass = 'veto'; }
                else if (action === 'HOLD' && d.reasoning && d.reasoning.includes('REJECTED')) { displayAction = 'REJECT'; actionClass = 'reject'; }
                else if (action === 'HOLD' && d.reasoning && d.reasoning.includes('AI SKIP')) { displayAction = 'AI SKIP'; actionClass = 'reject'; }
                else if (action === 'HOLD' && d.reasoning && d.reasoning.includes('AI MISMATCH')) { displayAction = 'MISMATCH'; actionClass = 'reject'; }
                // Check if AI confirmed (action is BUY/SELL and we have ai_action)
                else if ((action === 'BUY' || action === 'SELL') && d.ai_action) { displayAction = action + ' OK'; actionClass = 'confirmed'; }
                let reason = d.veto_reason || d.entry_reason || d.reasoning || 'No reasoning';
                if (reason.length > 120) reason = reason.substring(0, 120) + '...';
                // Add AI sub-info if present
                let aiInfo = '';
                if (d.ai_action && action === 'BUY' || action === 'SELL') {
                    if (d.ai_action && (d.ai_action === 'BUY' || d.ai_action === 'SELL')) {
                        aiInfo = '<div style="font-size: 10px; color: var(--accent-green); margin-top: 4px;">AI confirmed: ' + d.ai_action + ' (' + (d.ai_confidence || 0) + '%)</div>';
                    } else if (d.ai_action) {
                        aiInfo = '<div style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">AI: ' + d.ai_action + ' (' + (d.ai_confidence || 0) + '%)</div>';
                    }
                }
                html += '<div class="decision-item"><div class="decision-header"><span class="decision-symbol">' + (d.symbol || 'N/A') + '</span><span class="decision-action ' + actionClass + '">' + displayAction + '</span></div><div class="decision-reason">' + reason + '</div>' + aiInfo + '<div class="decision-meta"><span>' + time + '</span><span>Conf: ' + conf + '%</span><div class="confidence-bar"><div class="confidence-fill ' + confClass + '" style="width:' + conf + '%"></div></div></div></div>';
            });
            container.innerHTML = html;
        }

        function updateHistory(history) {
            const container = document.getElementById('trade-history');
            if (!history || history.length === 0) {
                showEmpty('trade-history', '○', 'No closed trades yet', 'Trades will appear here once the bot closes its first position');
                return;
            }
            let html = '<table class="positions-table"><thead><tr><th>Symbol</th><th>Type</th><th>Entry</th><th>Exit</th><th>P&L</th></tr></thead><tbody>';
            history.slice(0, 5).forEach(t => { const pnl = t.pnl || 0; const pnlClass = pnl >= 0 ? 'positive' : 'negative'; const sign = pnl >= 0 ? '+' : '-'; const absPnl = Math.abs(pnl).toFixed(2); html += '<tr><td><span class="symbol-badge">' + t.symbol + '</span></td><td><span class="type-badge ' + t.action.toLowerCase() + '">' + t.action + '</span></td><td>' + t.entry_price.toFixed(5) + '</td><td>' + (t.exit_price ? t.exit_price.toFixed(5) : '-') + '</td><td><span class="pnl-value ' + pnlClass + '">' + sign + '$' + absPnl + '</span></td></tr>'; });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function updateMarket(marketData) {
            const container = document.getElementById('market-data');
            if (!marketData || Object.keys(marketData).length === 0) { container.innerHTML = '<div class="empty-state"><p>No market data</p></div>'; return; }
            let html = '';
            Object.entries(marketData).forEach(([symbol, data]) => {
                const bid = data.bid || 0;
                const ask = data.ask || 0;
                const spread = data.spread || 0;
                const trend = data.trend_direction || 'SIDEWAYS';
                const trendClass = trend === 'BULL' ? 'bull' : trend === 'BEAR' ? 'bear' : 'sideways';
                html += '<div class="market-item"><div class="market-symbol"><div><div class="market-name">' + symbol + '</div><span class="market-trend ' + trendClass + '">' + trend + '</span></div></div><div class="market-price"><div class="market-price-value">' + bid.toFixed(5) + '</div><div class="market-price-info">Spread: ' + spread + '</div></div></div>';
            });
            container.innerHTML = html;
        }

        function showModal(message) { document.getElementById('modal-message').textContent = message; document.getElementById('symbolModal').classList.add('show'); }
        function closeModal() { document.getElementById('symbolModal').classList.remove('show'); }

        // Strategy configuration modal
        let configData = {};
        let activeConfigTab = 'scalp';
        const pendingChanges = {};

        document.getElementById('btn-config').addEventListener('click', openConfigModal);
        document.getElementById('btn-cancel-config').addEventListener('click', closeConfigModal);
        document.getElementById('btn-save-config').addEventListener('click', saveConfigChanges);
        document.getElementById('btn-reset-config').addEventListener('click', resetConfigs);

        function openConfigModal() {
            fetch('/api/strategies/config').then(r => r.json()).then(configs => {
                configData = JSON.parse(JSON.stringify(configs));
                Object.keys(pendingChanges).forEach(k => delete pendingChanges[k]);
                renderConfigTabs();
                renderConfigBody();
                document.getElementById('configModal').classList.add('show');
            });
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.remove('show');
            Object.keys(pendingChanges).forEach(k => delete pendingChanges[k]);
        }

        function renderConfigTabs() {
            const tabs = document.getElementById('config-tabs');
            let html = '';
            Object.keys(configData).forEach(name => {
                const active = name === activeConfigTab ? 'active' : '';
                html += '<button class="config-tab ' + active + '" data-strategy="' + name + '">' + configData[name].name + '</button>';
            });
            tabs.innerHTML = html;
            tabs.querySelectorAll('.config-tab').forEach(tab => {
                tab.addEventListener('click', e => {
                    activeConfigTab = e.target.dataset.strategy;
                    renderConfigTabs();
                    renderConfigBody();
                });
            });
        }

        function renderConfigBody() {
            const body = document.getElementById('config-body');
            const strategy = configData[activeConfigTab];
            if (!strategy) { body.innerHTML = ''; return; }
            let html = '<div class="config-section active"><p style="color: var(--text-muted); margin-bottom: 16px; font-size: 12px;">' + strategy.description + '</p>';

            // Render Timeframes section if present
            if (strategy.timeframes) {
                html += '<h4 style="color: var(--accent-cyan); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color);">Timeframes & Timing</h4>';
                Object.keys(strategy.timeframes).forEach(pkey => {
                    const p = strategy.timeframes[pkey];
                    const changeKey = activeConfigTab + '.' + pkey;
                    const currentVal = (changeKey in pendingChanges) ? pendingChanges[changeKey] : p.value;
                    html += '<div class="config-param">';
                    html += '<div class="config-param-label"><span class="label">' + p.label + '</span><span class="current-value" id="display-' + pkey + '">' + currentVal + '</span></div>';
                    if (p.description) html += '<div class="config-param-desc">' + p.description + '</div>';
                    if (p.type === 'select' && p.options) {
                        // Render as dropdown
                        html += '<select data-param="' + pkey + '" data-type="select" style="width:100%; padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-family: inherit; font-size: 14px;">';
                        p.options.forEach(opt => {
                            const sel = (opt === currentVal) ? ' selected' : '';
                            html += '<option value="' + opt + '"' + sel + '>' + opt + '</option>';
                        });
                        html += '</select>';
                    } else {
                        // Render as range + number
                        const step = p.step || 1;
                        html += '<div class="range-input">';
                        if (p.min !== undefined) html += '<input type="range" min="' + p.min + '" max="' + p.max + '" step="' + step + '" value="' + currentVal + '" data-param="' + pkey + '" style="flex:1">';
                        html += '<input type="number" min="' + (p.min || 0) + '" max="' + (p.max || 999) + '" step="' + step + '" value="' + currentVal + '" data-param="' + pkey + '" style="width: 80px;">';
                        html += '</div>';
                    }
                    html += '</div>';
                });
            }

            // Render Parameters section
            html += '<h4 style="color: var(--accent-cyan); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color);">Strategy Parameters</h4>';
            Object.keys(strategy.parameters).forEach(pkey => {
                const p = strategy.parameters[pkey];
                const step = p.step || 1;
                const changeKey = activeConfigTab + '.' + pkey;
                const currentVal = (changeKey in pendingChanges) ? pendingChanges[changeKey] : p.value;
                html += '<div class="config-param">';
                html += '<div class="config-param-label"><span class="label">' + p.label + '</span><span class="current-value" id="display-' + pkey + '">' + currentVal + '</span></div>';
                if (p.description) html += '<div class="config-param-desc">' + p.description + '</div>';
                html += '<div class="range-input">';
                if (p.min !== undefined) html += '<input type="range" min="' + p.min + '" max="' + p.max + '" step="' + step + '" value="' + currentVal + '" data-param="' + pkey + '" style="flex:1">';
                html += '<input type="number" min="' + (p.min || 0) + '" max="' + (p.max || 999) + '" step="' + step + '" value="' + currentVal + '" data-param="' + pkey + '" style="width: 80px;">';
                html += '</div></div>';
            });
            html += '</div>';
            body.innerHTML = html;

            // Wire up input events (range + number)
            body.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', e => {
                    const pkey = e.target.dataset.param;
                    const val = parseFloat(e.target.value);
                    pendingChanges[activeConfigTab + '.' + pkey] = val;
                    body.querySelectorAll('input[data-param="' + pkey + '"]').forEach(other => {
                        if (other !== e.target) other.value = val;
                    });
                    const display = document.getElementById('display-' + pkey);
                    if (display) display.textContent = val;
                });
            });

            // Wire up select events
            body.querySelectorAll('select[data-type="select"]').forEach(sel => {
                sel.addEventListener('change', e => {
                    const pkey = e.target.dataset.param;
                    pendingChanges[activeConfigTab + '.' + pkey] = e.target.value;
                    const display = document.getElementById('display-' + pkey);
                    if (display) display.textContent = e.target.value;
                });
            });
        }

        function saveConfigChanges() {
            const promises = Object.keys(pendingChanges).map(key => {
                const [strategy, param] = key.split('.');
                return fetch('/api/strategies/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ strategy, param, value: pendingChanges[key] })
                }).then(r => r.json());
            });
            Promise.all(promises).then(results => {
                const errors = results.filter(r => r.error);
                if (errors.length > 0) {
                    showModal('Some changes failed: ' + errors.map(e => e.error).join(', '));
                } else {
                    showModal('Configuration saved successfully!');
                    closeConfigModal();
                }
            });
        }

        function resetConfigs() {
            if (confirm('Reset all strategies to default settings? This cannot be undone.')) {
                fetch('/api/strategies/reset', { method: 'POST' }).then(r => r.json()).then(data => {
                    if (data.configs) {
                        configData = data.configs;
                        Object.keys(pendingChanges).forEach(k => delete pendingChanges[k]);
                        renderConfigTabs();
                        renderConfigBody();
                        showModal('Reset to defaults');
                    } else {
                        showModal('Failed to reset');
                    }
                });
            }
        }

        function runMLSearch() {
            if (!confirm('Run genetic algorithm search? This will test thousands of strategy combinations against MT5 historical data for ALL your enabled symbols. May take 2-5 minutes.')) return;
            const btn = document.getElementById('btn-ml-search');
            const oldText = btn.textContent;
            btn.textContent = 'Searching MT5 data...';
            btn.disabled = true;
            fetch('/api/ml/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ generations: 20, population_size: 50, days: 365 })
            }).then(r => r.json()).then(data => {
                btn.textContent = oldText;
                btn.disabled = false;
                if (data.error) {
                    showModal('ML Search failed: ' + data.error);
                } else {
                    const sourceMsg = data.data_source === 'MT5 historical'
                        ? 'using real MT5 historical data'
                        : 'using synthetic data (MT5 may not be connected)';
                    showModal(`ML Search complete! Found ${data.validated_count} validated strategies. Best PF: ${data.best_pf} (${sourceMsg}). Symbols: ${data.symbols_searched.join(', ')}`);
                }
            }).catch(err => {
                btn.textContent = oldText;
                btn.disabled = false;
                showModal('ML Search error: ' + err);
            });
        }
    </script>
</body>
</html>
